<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an account - Tripistry</title>
<link rel="stylesheet" href="style.css">

<style>
.auth-layout {
  min-height: calc(100vh - var(--nav-h));
  display: grid; grid-template-columns: 1fr 1fr;
}
.auth-visual {
  background: linear-gradient(160deg, #0f2a1a 0%, #1a5c3a 60%, #2d7a52 100%);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 3rem; position: relative; overflow: hidden;
}
.auth-visual-bg { position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18rem;opacity:0.06; }
.auth-visual-content { position:relative;z-index:1;color:#fff; }
.auth-form-wrap {
  display:flex;align-items:flex-start;justify-content:center;
  padding:3rem 2rem;background:var(--bg);overflow-y:auto;
}
.auth-form { width:100%;max-width:420px; }
.role-toggle {
  display:grid;grid-template-columns:1fr 1fr;
  border:1px solid var(--col-border);border-radius:var(--radius-sm);
  overflow:hidden;margin-bottom:1.5rem;
}
.role-btn {
  padding:0.625rem;font-size:0.875rem;font-weight:500;
  cursor:pointer;background:var(--bg);border:none;
  color:var(--col-muted);transition:all 0.15s;font-family:inherit;
}
.role-btn.active{background:var(--accent);color:#fff;}
.section-divider{font-size:0.8125rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--col-faint);margin:1.5rem 0 1rem;padding-top:1rem;border-top:1px solid var(--col-border);}
@media(max-width:700px){.auth-layout{grid-template-columns:1fr;}.auth-visual{display:none;}}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Tripistry</a>
</nav>

<div class="auth-layout">
  <div class="auth-visual">
    <div class="auth-visual-bg"></div>
    <div class="auth-visual-content">
      <h2 style="font-family:'DM Serif Display',serif;font-size:2.25rem;font-weight:400;line-height:1.2;margin-bottom:1rem;">Join Tripistry.</h2>
      <p style="font-size:0.9375rem;opacity:0.75;max-width:360px;line-height:1.65;">Create a free traveller account to browse, compare and book curated packages — or register as a travel agency to list and manage your offerings.</p>
    </div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form">
      <h1 style="font-size:1.75rem;margin-bottom:0.375rem;">Create an account</h1>
      <p class="text-muted text-sm" style="margin-bottom:1.75rem;">Free to join. No credit card required.</p>

      <div style="margin-bottom:1.25rem;">
        <div style="font-size:0.8125rem;font-weight:500;color:var(--col-muted);margin-bottom:0.5rem;">I am a:</div>
        <div class="role-toggle">
          <button class="role-btn active" id="role-traveller" onclick="setRole('traveller')">Traveller</button>
          <button class="role-btn" id="role-agency" onclick="setRole('agency')">Travel agency</button>
        </div>
      </div>

      <div id="traveller-fields">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:0.75rem;">
          <div class="form-group">
            <label>First name</label>
            <input id="reg-first-name" type="text" placeholder="Jane">
          </div>
          <div class="form-group">
            <label>Surname</label>
            <input id="reg-surname" type="text" placeholder=" Doe">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0.75rem;">
          <label>Middle initial <span class="text-faint">(optional)</span></label>
          <input id="reg-mid-init" type="text" placeholder="A" maxlength="1" style="max-width:80px;">
        </div>
        <div class="form-group" style="margin-bottom:0.75rem;">
          <label>Country of residence</label>
          <select id="reg-country">
            <option value="">Select a country</option>
            <option>South Africa</option>
            <option>Botswana</option>
            <option>Zimbabwe</option>
            <option>Kenya</option>
            <option>Nigeria</option>
            <option>United Kingdom</option>
            <option>United States</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div id="agency-fields" style="display:none;">
        <div class="form-group" style="margin-bottom:0.75rem;">
          <label>Agency / company name</label>
          <input id="reg-agency-name" type="text" placeholder="Wanderlust Co.">
        </div>
        <div class="form-group" style="margin-bottom:0.75rem;">
          <label>Agency description <span class="text-faint">(optional)</span></label>
          <textarea id="reg-agency-description" placeholder="Tell travellers about your agency…" style="min-height:80px;"></textarea>
        </div>
      </div>

      <div class="section-divider">Account credentials</div>

      <div class="form-group" style="margin-bottom:0.75rem;">
        <label>Username</label>
        <input id="reg-username" type="text" placeholder="janedoe" autocomplete="username">
      </div>
      <div class="form-group" style="margin-bottom:0.75rem;">
        <label>Email address</label>
        <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group" style="margin-bottom:0.75rem;">
        <label>Password</label>
        <input id="reg-password" type="password" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <div class="form-group" style="margin-bottom:0.75rem;">
        <label>Confirm password</label>
        <input id="reg-confirm-password" type="password" placeholder="Repeat your password" autocomplete="new-password">
      </div>
      <div class="form-group" style="margin-bottom:0.75rem;">
        <label>Contact number <span class="text-faint">(optional)</span></label>
        <input type="text" placeholder="+27 82 000 0000">
      </div>

      <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" onclick="handleRegister()">Create account</button>

      <div style="text-align:center;margin-top:1.25rem;">
        <span class="text-sm text-muted">Already have an account? </span>
        <a href="login.html" class="text-sm text-accent" style="text-decoration:none;font-weight:500;">Log in</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/register.js"></script>
</body>
</html>
